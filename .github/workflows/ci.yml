# CI комплекта ComfyUI Studio.
#
# Зачем он появился: до этого в репозитории не было НИ ОДНОЙ автоматической
# проверки, при том что tools/promptvault/CONTRIBUTING.md уже описывал
# `.github/workflows/ci.yml` как существующий. Практические последствия
# отсутствия гейта: 41 замечание ruff (включая два F601 -- молча
# перезаписанные переводы в comfyui_studio/i18n.py), 118 ошибок mypy и
# приватный SSH-ключ phone_key.txt, доехавший до HEAD и до GitHub
# (коммит a830091) -- потому что `git add .` никто не остановил.
#
# Раннер -- windows-latest, а не ubuntu: приложение Windows-only
# (taskkill, NVML, реестр Windows через QSettings, .bat-скрипты запуска
# ComfyUI), и часть тестов проверяет именно Windows-поведение.
#
# Python 3.11 -- нижняя граница из `requires-python` в pyproject.toml.
# На 3.10 часть тестов падает ЛОЖНО (например
# test_external_modification_between_read_and_write_is_detected:
# в 3.10 pathlib кэширует os.stat в _NormalAccessor и monkeypatch теста
# его не перехватывает) -- не поднимать ниже 3.11.
#
# Проверки разделены на два уровня:
#   * ГЕЙТ -- падение блокирует merge: ruff, pytest, mypy на strict-зоне;
#   * ИНФОРМАЦИОННО -- mypy по всему пакету (continue-on-error): 118
#     унаследованных ошибок в 34 файлах, из которых часть -- реальные
#     (например, remote/routes/ssh_config.py импортирует несуществующий
#     models.SshConfigResponse), а часть -- рассинхрон enum-стабов PySide6
#     (Qt.AlignCenter и т.п.). Делать это блокирующим сейчас -- значит
#     запретить любой merge до отдельного большого рефакторинга; отчёт
#     при этом виден в логе шага и в summary.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ruff / pytest / mypy
    runs-on: windows-latest

    env:
      # Qt без дисплея: pytest-qt поднимает QApplication, которому на
      # раннере нужен offscreen-платформенный плагин (см. ту же
      # рекомендацию в tools/promptvault/tests/conftest.py).
      QT_QPA_PLATFORM: offscreen
      # Стабильный вывод логов Python в CI (кириллица в сообщениях).
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # `.[imagine,dev]` -- не только `.[dev]`: тестам нужны рантайм-пакеты
      # extras `imagine` (tests/remote/test_mdns.py требует zeroconf,
      # tests/imagine/* -- fastapi), а `dev` даёт pytest/pytest-qt/ruff/mypy.
      # pytest-qt обязателен: он предоставляет фикстуры qapp и qtbot, без
      # которых не собираются ни tools/promptvault/tests (212 ошибок), ни
      # часть tests/launcher.
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[imagine,dev]"

      # ГЕЙТ 1: линт. Набор правил -- `select = ["E", "F"]` в pyproject.toml
      # (I/isort убран осознанно, причина -- в комментарии там же).
      # `ruff format` намеренно НЕ проверяется: форматтер в проекте
      # подключён, но сознательно не применён ко всему коду.
      - name: ruff
        run: ruff check . --output-format=github

      # ГЕЙТ 2: тесты. Запуск из корня -- testpaths = ["tools/promptvault/tests",
      # "tests"], addopts = "--import-mode=importlib" (без него 206 из 584
      # тестов не собирались из-за двух пакетов с именем `tests`).
      - name: pytest
        run: pytest -q

      # ГЕЙТ 3: типы в единственной строго типизированной зоне
      # ([[tool.mypy.overrides]] для comfyui_studio.promptvault.core.*).
      # Здесь должно быть 0 ошибок -- если стало не 0, это регрессия.
      - name: mypy (strict-зона promptvault.core)
        run: mypy comfyui_studio/promptvault/core

      # ИНФОРМАЦИОННО: полный mypy по пакету. Не блокирует merge (см.
      # комментарий в шапке файла), но результат виден в логе.
      - name: mypy (весь пакет, информационно)
        continue-on-error: true
        run: mypy comfyui_studio
