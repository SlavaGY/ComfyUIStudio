repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
        # ruff format подключён и настроен в pyproject.toml
        # ([tool.ruff.format]), но намеренно не добавлен как отдельный
        # хук здесь: у проекта уже устоявшийся "разреженный" стиль
        # (много намеренных пустых строк внутри функций для
        # читаемости), автоформаттер агрессивно его схлопывает — см.
        # CONTRIBUTING.md. Этот хук остаётся только для линтинга
        # (реальные ошибки + сортировка импортов).

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [PySide6==6.11.1]
        args: [comfyui_studio/promptvault/core]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]
