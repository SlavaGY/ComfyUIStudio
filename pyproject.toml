[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-studio"
version = "0.1.0"
description = "ComfyUI Studio — лаунчер ComfyUI + Prompt Builder + PromptVault в одном приложении"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.1",
    "psutil>=5.9",
    "nvidia-ml-py>=12.0",
]

[project.optional-dependencies]
# `pip install .[imagine]` — включает вариант запуска ComfyUI "Imagine"
# (см. comfyui_studio/imagine/ и launcher/core/imagine_process.py):
# карточный веб-генератор поверх ComfyUI, встроенный в Studio как
# альтернатива открытию сырого интерфейса ComfyUI. Без этой группы
# лаунчер всё равно запускается и работает как раньше — переключатель
# "Интерфейс: Imagine" в разделе настроек ComfyUI (ui/settings/
# comfyui_page.py) при попытке запуска покажет понятную ошибку вместо
# ImportError где-то в глубине imagine_process.py.
#
# ЭТА ЖЕ группа используется Remote (comfyui_studio/remote/, см.
# launcher/core/remote_process.py, ComfyUIStudio_Remote_Roadmap.md,
# этап 1) — тот же набор fastapi/uvicorn/pydantic/python-multipart,
# отдельной группы `remote` сознательно не заводили: Remote появился
# позже Imagine, когда эти зависимости уже были в проекте, а держать
# два одинаковых списка версий было бы источником рассинхронизации.
# Если Remote и Imagine когда-нибудь разойдутся по версиям своих
# зависимостей — тогда это стоит разделить.
imagine = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    "python-multipart>=0.0.9",
    # НОВОЕ (Remote, этап 3 дорожной карты): async WS-клиент внутри
    # comfyui_studio/imagine/backend/progress_forwarder.py (Imagine ->
    # ComfyUI, трансляция progress в Remote) -- та же библиотека, что
    # уже была в dev-группе НИЖЕ исключительно ради
    # tests/launcher/test_comfy_ws.py, теперь нужна и в рантайме
    # Imagine, не только в тестах.
    "websockets>=13.0",
    # НОВОЕ (Remote, этап 4 дорожной карты): async HTTP-клиент внутри
    # comfyui_studio/remote/imagine_proxy.py (reverse-proxy Remote ->
    # Imagine, см. §4/§0.3 -- "Что на сервере"). FastAPI и так тянет
    # httpx транзитивно (используется его собственным TestClient), но
    # это не гарантирует конкретную версию/наличие в рантайме без
    # прямого объявления -- поэтому здесь явно.
    "httpx>=0.27",
    # НОВОЕ (Remote, этап 5 дорожной карты): mDNS-объявление Remote в
    # локальной сети (comfyui_studio/remote/mdns.py, §5 -- "mDNS
    # discovery"). Используется async-API (zeroconf.asyncio) -- версия
    # с этим модулем стабильна уже много лет, нижняя граница здесь
    # мягкая, как и у остальных зависимостей этой группы.
    "zeroconf>=0.135",
    # НОВОЕ (Remote, этап 6.5 дорожной карты): OAuth2 к Google для
    # отправки push через FCM HTTP v1 API (comfyui_studio/remote/fcm.py,
    # §Этап 6.5 -- "Push-уведомления"). Только для service-account JWT/
    # обновления access-токена -- сама отправка сообщения обычным
    # urllib, поэтому не нужен более тяжёлый google-cloud-messaging.
    #
    # ИСПРАВЛЕНО (живой баг 2026-09-08): `google-auth` сам по себе НЕ
    # тянет `requests` как обязательную зависимость -- модуль
    # `google.auth.transport.requests.Request` (нужен для обновления
    # access-токена, см. fcm.py::_load_credentials) требует его
    # отдельно. Без extras `[requests]` `pip install google-auth`
    # ставился "успешно", но при первой же попытке импорта падал с
    # "The requests library is not installed" -- ловилось как ImportError
    # и маскировалось под общее "google-auth не установлен" (см. историю
    # диагностики в ComfyUIStudio_Remote_Roadmap.md, этап 6.5).
    "google-auth[requests]>=2.28",
]

# Инструменты разработки (pytest/ruff/mypy) — этап 5 дорожной карты
# рефакторинга ("cleanup") слил сюда группу `dev`, ранее жившую
# отдельно в tools/promptvault/pyproject.toml (тот файл удалён —
# единая точка правды вместо двух параллельных pyproject.toml с
# рассинхронизирующимися версиями зависимостей). pytest/ruff/mypy
# сейчас используются тестами PromptVault (tests/promptvault/) и
# Launcher (tests/launcher/, с этапа 6) — группа объявлена на уровне
# всего репозитория, а не привязана к одному инструменту.
#
# `websockets` добавлен на этапе 7 ИСКЛЮЧИТЕЛЬНО ради
# tests/launcher/test_comfy_ws.py — там поднимается настоящий локальный
# WS-сервер, чтобы проверить ComfyWebSocketClient (core/comfy_ws.py) на
# реальном разборе смешанных текстовых/бинарных фреймов, а не на моке.
# Клиентская сторона WebSocket в самом лаунчере -- PySide6.QtWebSockets
# (уже часть основной зависимости PySide6 выше), НЕ пакет `websockets`.
#
# ОБНОВЛЕНО (Remote, этап 3 дорожной карты): пакет `websockets` версией
# младше уже перечислен и в группе `imagine` выше — тот же самый пакет
# (не дублируем версию здесь второй раз внутри группы `dev`, а полагаемся
# на то, что группы extras можно комбинировать: `pip install .[dev]`
# уже не подтянет её отдельно от той, что в `imagine`, если обе группы
# указаны с одной и той же нижней границей версии) нужен теперь и в
# рантайме самого Imagine (comfyui_studio/imagine/backend/
# progress_forwarder.py), а не только тестам.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
    "websockets>=13.0",
]

# Установка:
#   pip install .              — Launcher + Prompt Builder + PromptVault
#   pip install .[dev]         — плюс инструменты разработки (тесты/линт/типы)

[tool.setuptools.packages.find]
include = ["comfyui_studio*"]

[tool.setuptools.package-data]
"comfyui_studio" = [
    "**/*.qss",
    "**/*.png",
    "**/*.ico",
    "**/*.qm",
    "**/*.ts",
    # Imagine (comfyui_studio/imagine/) — фронтенд без сборки и
    # бандловый workflow_template.json, см. imagine/assets/.
    "imagine/static/**/*.html",
    "imagine/static/**/*.css",
    "imagine/static/**/*.js",
    "imagine/assets/**/*.json",
]

# --------------------------------------------------------------------------
# Конфигурация pytest/coverage/ruff/mypy ниже — слита сюда из
# tools/promptvault/pyproject.toml на этапе 5 дорожной карты рефакторинга
# ("cleanup"). Изначально использовалась только пакетом
# comfyui_studio.promptvault (единственная часть комплекта с тестами и
# полным набором type hints на тот момент). Этап 6 добавил первые тесты
# для Launcher (tests/launcher/ — см. комментарий у testpaths ниже);
# Prompt Builder тестов по-прежнему не имеет — расширять дальше по мере
# появления.
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
# Все тесты комплекта живут в одном пакете tests/ (этап R11.5 плана
# рефакторинга): tests/promptvault/ (бывший tools/promptvault/tests/),
# tests/launcher/, tests/imagine/, tests/shared/ и т.д. Запускать pytest
# нужно из корня репозитория (там же, где этот pyproject.toml) —
# `pythonpath = ["."]` добавляет корень в sys.path, чтобы
# `import comfyui_studio...` резолвился без отдельной установки пакета.
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"

[tool.coverage.run]
source = ["comfyui_studio.promptvault"]
omit = [
    "comfyui_studio/promptvault/ui/*",
    "comfyui_studio/promptvault/main.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# намеренно небольшой набор правил на старте — Pyflakes (ошибки) +
# наведение порядка импортов; расширять по мере обкатки на реальном коде
select = ["E", "F", "I", "BLE"]
ignore = [
    "E501",  # длина строки — уже покрыта line-length, не дублируем как ошибку
]

# BLE001 (этап R11.2 плана): `except Exception` допустим только как граница
# подсистемы (с логом). Файлы ниже — те, где такие обработчики уже были на
# момент включения правила; ни один новый файл в список попадать не должен.
# Число обработчиков в каждом файле не даст расти тест
# tests/shared/test_broad_except_budget.py (там же — исходные числа).
# Трогаешь файл — сужай исключения в нём и уменьшай число в тесте.
[tool.ruff.lint.per-file-ignores]
"comfyui_studio/imagine/backend/comfy_client.py" = ["BLE001"]  # 1
"comfyui_studio/imagine/backend/progress_forwarder.py" = ["BLE001"]  # 1
"comfyui_studio/imagine/backend/promptgen.py" = ["BLE001"]  # 5
"comfyui_studio/imagine/backend/promptgen_diag.py" = ["BLE001"]  # 12
"comfyui_studio/imagine/backend/promptgen_process.py" = ["BLE001"]  # 4
"comfyui_studio/launcher/core/background.py" = ["BLE001"]  # 1
"comfyui_studio/launcher/core/comfy_api.py" = ["BLE001"]  # 2
"comfyui_studio/launcher/core/comfy_process.py" = ["BLE001"]  # 1
"comfyui_studio/launcher/core/comfy_ws.py" = ["BLE001"]  # 1
"comfyui_studio/launcher/core/config.py" = ["BLE001"]  # 2
"comfyui_studio/launcher/core/managed_process.py" = ["BLE001"]  # 6
"comfyui_studio/launcher/core/remote_net.py" = ["BLE001"]  # 1
"comfyui_studio/launcher/core/system_monitor.py" = ["BLE001"]  # 3
"comfyui_studio/launcher/integration/comfy_theme.py" = ["BLE001"]  # 1
"comfyui_studio/launcher/ui/remote_controller.py" = ["BLE001"]  # 1
"comfyui_studio/launcher/ui/settings/prompt_history_page.py" = ["BLE001"]  # 5
"comfyui_studio/launcher/ui/settings/promptvault_page.py" = ["BLE001"]  # 1
"comfyui_studio/launcher/ui/settings_page.py" = ["BLE001"]  # 2
"comfyui_studio/mem_diagnostics.py" = ["BLE001"]  # 4
"comfyui_studio/promptgen_history.py" = ["BLE001"]  # 1
"comfyui_studio/promptvault/main.py" = ["BLE001"]  # 2
"comfyui_studio/promptvault/utils.py" = ["BLE001"]  # 1
"comfyui_studio/remote/app_launcher.py" = ["BLE001"]  # 1
"comfyui_studio/remote/comfy_launcher.py" = ["BLE001"]  # 2
"comfyui_studio/remote/device_store.py" = ["BLE001"]  # 1
"comfyui_studio/remote/fcm.py" = ["BLE001"]  # 2
"comfyui_studio/remote/generation_watcher.py" = ["BLE001"]  # 1
"comfyui_studio/remote/gpu_stats.py" = ["BLE001"]  # 3
"comfyui_studio/remote/mdns.py" = ["BLE001"]  # 2
"comfyui_studio/remote/process_by_port.py" = ["BLE001"]  # 1
"comfyui_studio/remote/ssh_config_store.py" = ["BLE001"]  # 1
"comfyui_studio/remote/ws_hub.py" = ["BLE001"]  # 1
"comfyui_studio/shared_promptgen.py" = ["BLE001"]  # 3
"tests/test_promptgen_history.py" = ["BLE001"]  # 1

[tool.ruff.format]
# ruff format ПОДКЛЮЧЁН и настроен здесь — доступен любому через
# `ruff format comfyui_studio/promptvault` / `ruff format --diff
# comfyui_studio/promptvault` — но СОЗНАТЕЛЬНО НЕ применён ко всему
# проекту разом и НЕ включён в pre-commit (см.
# tools/promptvault/.pre-commit-config.yaml).
#
# Причина (перенесена из исходного tools/promptvault/pyproject.toml,
# см. git-историю): `ruff format --diff` на срез кода PromptVault до
# этого решения давал diff по 25 файлам из 25, ~1330 удалённых строк —
# почти все удаления это схлопывание одиночных пустых строк, специально
# расставленных внутри функций между логическими блоками (устоявшийся
# стиль читаемости этого проекта, не случайные пробелы), плюс
# разворачивание однострочных литералов-множеств/списков в
# по-элементно-построчный вид. И то и другое реальные, целенаправленные
# стилистические решения, а не "грязь", которую формуттеру следует
# убрать.
#
# Разово применить ruff format ко всему проекту (согласившись со
# сменой стиля) можно централизованно одной командой в отдельном
# PR — но это самостоятельное решение о смене конвенций проекта, не
# то же самое, что "подключить форматтер", и не должно происходить
# незаметно как побочный эффект автокоммита pre-commit хука.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
# UI-слой (PySide6-виджеты) пока не типизирован полностью — начинаем
# со строгой проверки только для comfyui_studio/promptvault/core, где
# сосредоточена бизнес-логика. tests/ исключены по
# той же причине, что и раньше (тесты не покрыты strict-типизацией).
exclude = ["comfyui_studio/promptvault/ui/", "tests/"]

[[tool.mypy.overrides]]
module = "comfyui_studio.promptvault.core.*"
# --strict для бизнес-логики — набор флагов эквивалентен mypy --strict,
# перечислен явно (а не через strict = true), чтобы controlled полем
# ignore_missing_imports сверху не переопределялся неявно и было видно,
# что именно включено
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

# Этапы R8/R2/R9/R11 (правило R11.3 плана: новые модули — со строгим mypy с первого дня).
[[tool.mypy.overrides]]
module = [
    "comfyui_studio.themes.base",
    "comfyui_studio.i18n_base",
    "comfyui_studio.app_paths",
    "comfyui_studio.prompt_builder.tree_ops",
    "comfyui_studio.errors",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
