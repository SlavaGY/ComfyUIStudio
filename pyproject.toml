[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-studio"
version = "0.1.0"
description = "ComfyUI Studio — лаунчер ComfyUI + Prompt Builder + PromptVault в одном приложении"
requires-python = ">=3.11"
# Базовые зависимости — нужны, чтобы запустить лаунчер и Prompt Builder,
# и чтобы PromptVault открывался и был полностью рабочим (обычный
# текстовый поиск, фильтры, галерея, метаданные) БЕЗ семантического
# (по смыслу) поиска.
#
# numpy здесь НЕ вынесен в опциональную группу `promptvault`, хотя
# исторически (в удалённом requirements.txt, до слияния зависимостей в
# этот файл) шёл в одном списке с torch/sentence-transformers — в
# отличие от них, comfyui_studio/promptvault/
# core/embedding.py импортирует numpy БЕЗУСЛОВНО на уровне модуля
# (не лениво внутри функций, как torch/sentence_transformers), а
# GalleryManager импортирует embedding тоже безусловно — то есть
# PromptVault физически не откроется без numpy уже сейчас, независимо
# от опциональной группы ниже. Сделать сам numpy тоже честно
# опциональным — это отдельная переработка core/embedding.py (вынос
# байтовой (де)сериализации эмбеддингов в чистый Python/array), не
# входящая в объём этапа 3; при этом numpy сам по себе лёгкий (в
# отличие от torch/sentence-transformers) и не создаёт той проблемы
# (гигабайты в exe, конфликт версий), ради которой затевался этот
# этап — поэтому он остаётся здесь как обычная зависимость.
dependencies = [
    "PySide6==6.11.1",
    "psutil>=5.9",
    "nvidia-ml-py>=12.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# `pip install .[promptvault]` — включает семантический (по смыслу)
# поиск в PromptVault. Без этой группы PromptVault всё равно
# запускается и полностью работает — просто чекбокс "Enable semantic
# search" в его настройках задизейблен с пояснением, см.
# comfyui_studio/promptvault/ui/settings_window.py
# (_apply_semantic_search_availability) и
# comfyui_studio/promptvault/core/embedding.py (is_available/
# set_enabled) — runtime-защита там уже была устроена достаточно
# аккуратно (ленивые импорты torch/sentence_transformers внутри функций,
# а не на уровне модуля) до этого этапа, этап 3 лишь добавил
# pip-разметку зависимостей и довёл до UI то, что ядро уже умело
# определять само.
promptvault = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
]

# Инструменты разработки (pytest/ruff/mypy) — этап 5 дорожной карты
# рефакторинга ("cleanup") слил сюда группу `dev`, ранее жившую
# отдельно в tools/promptvault/pyproject.toml (тот файл удалён —
# единая точка правды вместо двух параллельных pyproject.toml с
# рассинхронизирующимися версиями зависимостей). pytest/ruff/mypy
# сейчас используются только тестами PromptVault
# (tools/promptvault/tests/), но группа объявлена на уровне всего
# репозитория, а не только для промптвольта — на случай, если Launcher/
# Prompt Builder тоже обзаведутся тестами позже.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Установка:
#   pip install .              — Launcher + Prompt Builder + PromptVault
#                                 без семантического поиска
#   pip install .[promptvault] — полный комплект
#   pip install .[dev]         — плюс инструменты разработки (тесты/линт/типы)

[tool.setuptools.packages.find]
include = ["comfyui_studio*"]

[tool.setuptools.package-data]
"comfyui_studio" = [
    "**/*.qss",
    "**/*.png",
    "**/*.ico",
    "**/*.qm",
    "**/*.ts",
]

# --------------------------------------------------------------------------
# Конфигурация pytest/coverage/ruff/mypy ниже — слита сюда из
# tools/promptvault/pyproject.toml на этапе 5 дорожной карты рефакторинга
# ("cleanup"). Изначально использовалась только пакетом
# comfyui_studio.promptvault (единственная часть комплекта с тестами и
# полным набором type hints на тот момент). Этап 6 добавил первые тесты
# для Launcher (tests/launcher/ — см. комментарий у testpaths ниже);
# Prompt Builder тестов по-прежнему не имеет — расширять дальше по мере
# появления.
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
# Тесты PromptVault физически остаются в tools/promptvault/tests/ (этап 2
# дорожной карты переносил только сам ИМПОРТИРУЕМЫЙ пакет — бывший app/,
# теперь comfyui_studio/promptvault/ — под общее пространство имён
# комплекта; сами тесты никогда не переезжали). Тесты Launcher (с этапа 6)
# живут в новом корневом tests/launcher/ — для Launcher нет своего
# tools/<name>/, в отличие от PromptVault/Prompt Builder, так что нет и
# унаследованной директории тестов рядом со старым расположением, которую
# нужно было бы сохранять. Запускать pytest нужно из корня репозитория
# (там же, где этот pyproject.toml) — `pythonpath = ["."]` добавляет
# корень в sys.path, чтобы `import comfyui_studio...` резолвился без
# отдельной установки пакета.
testpaths = ["tools/promptvault/tests", "tests"]
pythonpath = ["."]
qt_api = "pyside6"

[tool.coverage.run]
source = ["comfyui_studio.promptvault"]
omit = [
    "comfyui_studio/promptvault/ui/*",
    "comfyui_studio/promptvault/main.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# намеренно небольшой набор правил на старте — Pyflakes (ошибки) +
# наведение порядка импортов; расширять по мере обкатки на реальном коде
select = ["E", "F", "I"]
ignore = [
    "E501",  # длина строки — уже покрыта line-length, не дублируем как ошибку
]

[tool.ruff.format]
# ruff format ПОДКЛЮЧЁН и настроен здесь — доступен любому через
# `ruff format comfyui_studio/promptvault` / `ruff format --diff
# comfyui_studio/promptvault` — но СОЗНАТЕЛЬНО НЕ применён ко всему
# проекту разом и НЕ включён в pre-commit (см.
# tools/promptvault/.pre-commit-config.yaml).
#
# Причина (перенесена из исходного tools/promptvault/pyproject.toml,
# см. git-историю): `ruff format --diff` на срез кода PromptVault до
# этого решения давал diff по 25 файлам из 25, ~1330 удалённых строк —
# почти все удаления это схлопывание одиночных пустых строк, специально
# расставленных внутри функций между логическими блоками (устоявшийся
# стиль читаемости этого проекта, не случайные пробелы), плюс
# разворачивание однострочных литералов-множеств/списков в
# по-элементно-построчный вид. И то и другое реальные, целенаправленные
# стилистические решения, а не "грязь", которую формуттеру следует
# убрать.
#
# Разово применить ruff format ко всему проекту (согласившись со
# сменой стиля) можно централизованно одной командой в отдельном
# PR — но это самостоятельное решение о смене конвенций проекта, не
# то же самое, что "подключить форматтер", и не должно происходить
# незаметно как побочный эффект автокоммита pre-commit хука.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
# UI-слой (PySide6-виджеты) пока не типизирован полностью — начинаем
# со строгой проверки только для comfyui_studio/promptvault/core, где
# сосредоточена бизнес-логика. tools/promptvault/tests/ исключены по
# той же причине, что и раньше (тесты не покрыты strict-типизацией).
exclude = ["comfyui_studio/promptvault/ui/", "tools/promptvault/tests/"]

[[tool.mypy.overrides]]
module = "comfyui_studio.promptvault.core.*"
# --strict для бизнес-логики — набор флагов эквивалентен mypy --strict,
# перечислен явно (а не через strict = true), чтобы controlled полем
# ignore_missing_imports сверху не переопределялся неявно и было видно,
# что именно включено
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
